<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Abhishek Umarkar AI builder profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="55%" stop-color="#09111b"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#49d8ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#49d8ff"/>
      <stop offset="100%" stop-color="#8b7cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="65%" stop-color="#bdefff"/>
      <stop offset="100%" stop-color="#9aa7ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#5e7894" stroke-opacity=".13"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="418" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- ambient system glow -->
    <circle cx="930" cy="205" r="170" fill="#1685ff" opacity=".08" filter="url(#soft)">
      <animate attributeName="opacity" values=".04;.12;.04" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- circuit traces -->
    <g fill="none" stroke="#5fdcff" stroke-opacity=".28" stroke-width="1.2">
      <path d="M40 86H210L245 51H360"/>
      <path d="M860 62H1000L1040 102H1180"/>
      <path d="M38 338H190L225 303H350"/>
      <path d="M850 350H970L1015 305H1180"/>
      <path d="M1010 150V215H1145"/>
      <path d="M90 160V215H180"/>
    </g>
    <g fill="#65dcff" filter="url(#glow)">
      <circle cx="210" cy="86" r="2.5"/><circle cx="360" cy="51" r="2.5"/>
      <circle cx="1000" cy="62" r="2.5"/><circle cx="1040" cy="102" r="2.5"/>
      <circle cx="190" cy="338" r="2.5"/><circle cx="350" cy="303" r="2.5"/>
      <circle cx="970" cy="350" r="2.5"/><circle cx="1015" cy="305" r="2.5"/>
    </g>

    <!-- moving scan line -->
    <rect x="-80" y="70" width="70" height="280" fill="url(#cyan)" opacity=".65" filter="url(#soft)">
      <animate attributeName="x" from="-100" to="1230" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M0 112H1200" stroke="#4bdcff" stroke-opacity=".08">
      <animate attributeName="d" values="M0 112H1200;M0 308H1200;M0 112H1200" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- floating particles -->
    <g fill="#75e4ff">
      <circle cx="145" cy="130" r="1.5"><animate attributeName="cy" values="130;112;130" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="260" r="1.5"><animate attributeName="cy" values="260;278;260" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="125" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="165" cy="285" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- central identity -->
    <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
      <text x="600" y="118" fill="#6ee7ff" font-size="13" letter-spacing="5">
        AI • SOFTWARE • SYSTEMS
      </text>
      <text x="600" y="190" fill="url(#text)" font-size="46" font-weight="700" letter-spacing="1">
        ABHISHEK UMARKAR
      </text>
      <text x="600" y="232" fill="#d7e2ec" font-size="20" font-weight="600">
        AI Builder  ·  Full Stack Developer  ·  Systems Engineer
      </text>
      <text x="600" y="274" fill="#8fa5b8" font-size="14">
        Building AI-native products, developer tools, automation systems &amp; real-world software.
      </text>
    </g>

    <!-- status line -->
    <g transform="translate(600 325)" text-anchor="middle" font-family="monospace">
      <rect x="-210" y="-20" width="420" height="40" rx="20" fill="#07131d" stroke="#2a566c" stroke-opacity=".8"/>
      <circle cx="-176" cy="0" r="4" fill="#45e6a8">
        <animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" fill="#9ed9ea" font-size="13">BUILDING: ABHICODE</text>
    </g>

    <!-- bottom moving telemetry -->
    <g font-family="monospace" font-size="10" fill="#5d7890" opacity=".7">
      <text x="38" y="393">LOCAL_LLM</text>
      <text x="210" y="393">AI_AGENTS</text>
      <text x="395" y="393">CODE_INTELLIGENCE</text>
      <text x="650" y="393">AUTOMATION</text>
      <text x="820" y="393">FULL_STACK</text>
      <text x="1010" y="393">BUILD_MODE</text>
      <rect x="38" y="400" width="1124" height="1" fill="#365366">
        <animate attributeName="width" values="0;1124;0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#263646" stroke-width="2"/>
</svg>
